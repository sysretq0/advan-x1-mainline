name: Build Mainline Kernel & LNXB Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      linux_ref:
        description: 'Upstream Linux Git Ref (tag, branch, commit)'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4

      - name: Free disk space & configure runner swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo fallocate -l 4G /swapfile 2>/dev/null || true
          sudo chmod 600 /swapfile 2>/dev/null || true
          sudo mkswap /swapfile 2>/dev/null || true
          sudo swapon /swapfile 2>/dev/null || true
          free -h
          df -h

      - name: Install build toolchain & dependencies
        timeout-minutes: 10
        run: |
          # Keep official Ubuntu sources, remove external third-party PPAs that cause slow hangs
          sudo find /etc/apt/sources.list.d/ -type f ! -name "*ubuntu*" -delete 2>/dev/null || true
          sudo apt-get -o Acquire::http::Timeout="20" -o Acquire::Retries="3" update
          sudo apt-get -o Acquire::http::Timeout="30" -o Acquire::Retries="3" install -y --no-install-recommends \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            bc bison flex libssl-dev libelf-dev device-tree-compiler xz-utils python3 \
            cpio curl bzip2

      - name: Build static BusyBox & package initramfs
        timeout-minutes: 10
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p "$GITHUB_WORKSPACE/busybox-build"
          cd "$GITHUB_WORKSPACE/busybox-build"
          curl -fsSL --connect-timeout 20 --max-time 180 --retry 3 https://busybox.net/downloads/busybox-1.38.0.tar.bz2 | tar -xj
          cd busybox-1.38.0
          make defconfig
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/CONFIG_TC=y/# CONFIG_TC is not set/' .config
          yes "" | make oldconfig
          make -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu- install CONFIG_PREFIX="$GITHUB_WORKSPACE/initramfs_root"
          
          # Setup directories and copy /init
          cd "$GITHUB_WORKSPACE/initramfs_root"
          mkdir -p dev proc sys mnt run tmp etc root
          cp "$GITHUB_WORKSPACE/initramfs/init" init
          chmod +x init
          
          # Package into initramfs.cpio.gz
          find . | cpio -H newc -o | gzip -9 > "$GITHUB_WORKSPACE/build/initramfs.cpio.gz"
          ls -lh "$GITHUB_WORKSPACE/build/initramfs.cpio.gz"

      - name: Checkout upstream Linux kernel
        timeout-minutes: 10
        run: |
          mkdir -p "$GITHUB_WORKSPACE/linux"
          git clone --depth 1 --single-branch --config net.gitFetchDefaultTimeout=120 --branch ${{ inputs.linux_ref || 'master' }} https://github.com/torvalds/linux.git "$GITHUB_WORKSPACE/linux"

      - name: Apply MT6789 patch series
        timeout-minutes: 5
        run: |
          cd "$GITHUB_WORKSPACE/linux"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo "Applying $(basename "$p")..."
            git apply --whitespace=nowarn "$p"
          done

      - name: Configure kernel
        timeout-minutes: 5
        run: |
          cd "$GITHUB_WORKSPACE/linux"
          make ARCH=arm64 defconfig
          scripts/kconfig/merge_config.sh -m -O . .config "$GITHUB_WORKSPACE"/config/*.configfrag
          make ARCH=arm64 olddefconfig LLVM=1

      - name: Compile kernel Image
        timeout-minutes: 75
        run: |
          cd "$GITHUB_WORKSPACE/linux"
          make -j$(nproc) ARCH=arm64 LLVM=1 Image

      - name: Compile Advan X1 device tree blob
        timeout-minutes: 5
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          cp "$GITHUB_WORKSPACE/linux/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/build/Image"
          
          PDTB="$GITHUB_WORKSPACE/build/advan_x1.dts.tmp"
          clang -target aarch64-linux-gnu -E -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
            -I "$GITHUB_WORKSPACE/linux/include" \
            -I "$GITHUB_WORKSPACE/linux/include/dt-bindings" \
            -I "$GITHUB_WORKSPACE/linux/arch/arm64/boot/dts" \
            "$GITHUB_WORKSPACE"/dts/mt6789-advan-x1.dts -o "$PDTB"
          dtc -I dts -O dtb -o "$GITHUB_WORKSPACE/build/mt6789-advan-x1.dtb" "$PDTB"
          rm -f "$PDTB"

      - name: Pack LNXB bundle
        timeout-minutes: 5
        run: |
          python3 "$GITHUB_WORKSPACE/tools/pack_linux_bundle.py" \
            --kernel "$GITHUB_WORKSPACE/build/Image" \
            --dtb "$GITHUB_WORKSPACE/build/mt6789-advan-x1.dtb" \
            --initramfs "$GITHUB_WORKSPACE/build/initramfs.cpio.gz" \
            --out "$GITHUB_WORKSPACE/build/bundle.img"
          
          cd "$GITHUB_WORKSPACE/build"
          sha256sum Image mt6789-advan-x1.dtb initramfs.cpio.gz bundle.img > sha256sums.txt
          cat sha256sums.txt

      - name: Compress artifacts into tar.xz
        timeout-minutes: 5
        run: |
          cd "$GITHUB_WORKSPACE/build"
          XZ_OPT="-9e -T0" tar -cJf "$GITHUB_WORKSPACE/bundle.tar.xz" bundle.img Image mt6789-advan-x1.dtb initramfs.cpio.gz sha256sums.txt
          ls -lh "$GITHUB_WORKSPACE/bundle.tar.xz"

      - name: Upload bundle.tar.xz artifact
        timeout-minutes: 15
        uses: actions/upload-artifact@v4
        with:
          name: advan-x1-mainline-bundle
          path: bundle.tar.xz
          if-no-files-found: error
          retention-days: 14
