name: Build Mainline Kernel & U-Boot FIT Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      linux_ref:
        description: 'Upstream Linux Git Ref (tag, branch, commit)'
        required: true
        default: 'master'
      compression:
        description: 'FIT kernel compression (gzip, lzma, lz4, none)'
        required: true
        default: 'gzip'
      boot_mode:
        description: 'Storage layout mode (auto, single, split)'
        required: true
        default: 'auto'
      use_ccache:
        description: 'Enable ccache compiler cache (uncheck for completely clean build)'
        required: true
        type: boolean
        default: true
      build_gnome_mobile:
        description: 'Compile GNOME Mobile (mutter-mobile + gnome-shell-mobile) with Google Clang after kmod repack'
        required: true
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    env:
      # Pinned to AOSP android-mainline bazel/constants.scl CLANG_VERSION.
      CLANG_VERSION: r614150
      TOOLCHAIN_ROOT: ${{ github.workspace }}/toolchain

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v6

      - name: Setup compiler cache mode
        run: |
          if [ "${{ github.event_name != 'workflow_dispatch' || inputs.use_ccache == true }}" = "true" ]; then
            echo "USE_CCACHE=true" >> $GITHUB_ENV
            echo "CC_LAUNCHER=ccache " >> $GITHUB_ENV
            echo "Ccache enabled: using cached compiler artifacts"
          else
            echo "USE_CCACHE=false" >> $GITHUB_ENV
            echo "CC_LAUNCHER=" >> $GITHUB_ENV
            echo "Ccache disabled: performing clean build"
          fi

      - name: Configure runner swap
        run: |
          sudo fallocate -l 4G /swapfile 2>/dev/null || true
          sudo chmod 600 /swapfile 2>/dev/null || true
          sudo mkswap /swapfile 2>/dev/null || true
          sudo swapon /swapfile 2>/dev/null || true
          free -h

      - name: Speed up APT & install build dependencies
        timeout-minutes: 5
        run: |
          # 1. Force IPv4 and disable HTTP pipelining to eliminate network stalls and timeouts
          echo 'Acquire::ForceIPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4
          echo 'Acquire::http::Pipeline-Depth "0";' | sudo tee -a /etc/apt/apt.conf.d/99force-ipv4

          # 2. Overwrite /etc/apt/apt-mirrors.txt which APT uses via mirror+file: in ubuntu.sources
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://azure.archive.ubuntu.com/ubuntu\tpriority:1\nhttps://archive.ubuntu.com/ubuntu\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi

          # 3. Direct ubuntu.sources away from mirror+file or any throttled ec2 mirrors directly to fast CDN mirrors
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          sudo sed -i 's|http://.*ec2.archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/* /etc/apt/sources.list /etc/apt/apt-mirrors.txt 2>/dev/null || true

          # 4. Clean unneeded third-party PPAs while safely keeping ubuntu.sources
          sudo find /etc/apt/sources.list.d/ -type f ! -name "*ubuntu*" -delete 2>/dev/null || true

          # 5. Update index and install ONLY genuinely missing packages
          # (bc, bison, flex, libssl-dev, xz-utils, python3, cpio, curl, bzip2 are already pre-installed;
          #  AOSP Clang supplies clang/lld/llvm-* so skip Ubuntu's clang/lld/llvm packages)
          sudo apt-get -o Acquire::Retries="3" update -qq
          sudo apt-get -o Acquire::Retries="3" install -y --no-install-recommends \
            device-tree-compiler libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            u-boot-tools dosfstools mtools lz4 kmod \
            ccache

      # ---- Fail-fast early initramfs/BusyBox phase (<30s cold, <5s warm) ----
      - name: Restore static BusyBox cache
        id: busybox-cache
        uses: actions/cache/restore@v6
        with:
          path: build/busybox-install
          key: busybox-1.38.0-arm64-static-${{ runner.os }}

      - name: Build static BusyBox (cache miss only)
        if: ${{ steps.busybox-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 10
        env:
          OUT: ${{ github.workspace }}/build
        run: |
          BUSYBOX_ONLY=1 JOBS="$(nproc)" ./scripts/build-initramfs.sh

      - name: Save static BusyBox cache
        if: ${{ steps.busybox-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: build/busybox-install
          key: busybox-1.38.0-arm64-static-${{ runner.os }}

      # ---- Slim AOSP Clang (pruned to kernel-only tools, saved immediately) ----
      - name: Restore slim Google Clang cache
        id: clang-cache
        uses: actions/cache/restore@v6
        with:
          path: toolchain/clang-${{ env.CLANG_VERSION }}
          key: aosp-clang-${{ env.CLANG_VERSION }}-kernel-slim-${{ runner.os }}

      - name: Setup Google Clang (kernel-slim)
        timeout-minutes: 10
        run: |
          CLANG_DIR="$(PRUNE_FOR_KERNEL=1 ./scripts/setup-google-clang.sh)"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          "$CLANG_DIR/bin/clang" --version | head -n 2

      - name: Save slim Google Clang cache
        if: ${{ steps.clang-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: toolchain/clang-${{ env.CLANG_VERSION }}
          key: aosp-clang-${{ env.CLANG_VERSION }}-kernel-slim-${{ runner.os }}

      # ---- ccache restore & setup ----
      - name: Restore ccache cache
        id: ccache-restore
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_ccache == true }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-arm64-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-arm64-${{ runner.os }}-${{ github.ref_name }}-
            ccache-linux-arm64-${{ runner.os }}-main-
            ccache-linux-arm64-${{ runner.os }}-

      - name: Configure ccache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_ccache == true }}
        run: |
          mkdir -p ~/.cache/ccache
          ccache --set-config=max_size=1.0G
          ccache --set-config=compression=true
          ccache --set-config=compression_level=6
          ccache --set-config=base_dir="$GITHUB_WORKSPACE"
          ccache --set-config=compiler_check="%compiler% --version"
          ccache --set-config=sloppiness=time_macros,include_file_mtime,file_macro
          ccache -z
          ccache -s

      - name: Checkout upstream Linux kernel
        timeout-minutes: 10
        run: |
          mkdir -p "$GITHUB_WORKSPACE/linux"
          git clone --depth 1 --single-branch --config net.gitFetchDefaultTimeout=120 --branch ${{ inputs.linux_ref || 'master' }} https://github.com/torvalds/linux.git "$GITHUB_WORKSPACE/linux"

      - name: Apply MT6789 patch series
        timeout-minutes: 5
        run: |
          cd "$GITHUB_WORKSPACE/linux"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in "$GITHUB_WORKSPACE"/patches/*/*.patch "$GITHUB_WORKSPACE"/patches/*.patch; do
            [ -e "$p" ] || continue
            echo "Applying ${p#"$GITHUB_WORKSPACE"/}..."
            git apply --whitespace=nowarn "$p"
          done

      - name: Configure kernel
        timeout-minutes: 5
        run: |
          cd "$GITHUB_WORKSPACE/linux"
          make ARCH=arm64 defconfig
          scripts/kconfig/merge_config.sh -m -O . .config "$GITHUB_WORKSPACE"/config/*.configfrag
          make ARCH=arm64 olddefconfig LLVM=1 CC="${CC_LAUNCHER}clang" HOSTCC="${CC_LAUNCHER}clang"

      - name: Compile kernel Image
        id: compile-kernel
        timeout-minutes: 75
        env:
          KBUILD_BUILD_TIMESTAMP: ""
          KBUILD_BUILD_USER: "builder"
          KBUILD_BUILD_HOST: "github-actions"
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
        run: |
          cd "$GITHUB_WORKSPACE/linux"
          make -j$(nproc) ARCH=arm64 LLVM=1 CC="${CC_LAUNCHER}clang" HOSTCC="${CC_LAUNCHER}clang" Image

      - name: Build initramfs (static C /init + BusyBox rescue + curated kmods)
        timeout-minutes: 15
        env:
          K: ${{ github.workspace }}/linux
          WORK: ${{ github.workspace }}/linux
          OUT: ${{ github.workspace }}/build
          NO_O: "1"
          KBUILD_BUILD_TIMESTAMP: ""
          KBUILD_BUILD_USER: "builder"
          KBUILD_BUILD_HOST: "github-actions"
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
        run: |
          JOBS="$(nproc)" \
          KMAKE_CC="${CC_LAUNCHER}clang" \
          KMAKE_HOSTCC="${CC_LAUNCHER}clang" \
          ./scripts/build-initramfs.sh

      - name: Save ccache cache
        if: ${{ (success() || failure()) && (github.event_name != 'workflow_dispatch' || inputs.use_ccache == true) && steps.compile-kernel.outcome == 'success' && steps.ccache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ccache
          key: ccache-linux-arm64-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}

      - name: Prune stale ccache caches (keep 2 newest for branch)
        if: ${{ (success() || failure()) && (github.event_name != 'workflow_dispatch' || inputs.use_ccache == true) && steps.compile-kernel.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="ccache-linux-arm64-${{ runner.os }}-${{ github.ref_name }}-"
          IDS=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100&key=${PREFIX}&sort=last_accessed_at&direction=desc" \
            --jq '.actions_caches[2:][].id' 2>/dev/null || true)
          for id in $IDS; do
            echo "Pruning stale cache id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" 2>/dev/null || true
          done

      - name: Ccache statistics
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.use_ccache == true) }}
        run: |
          echo "### Ccache Statistics" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ccache -s >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Compile Advan X1 device tree blob
        timeout-minutes: 5
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          cp "$GITHUB_WORKSPACE/linux/arch/arm64/boot/Image" "$GITHUB_WORKSPACE/build/Image"
          
          PDTB="$GITHUB_WORKSPACE/build/advan_x1.dts.tmp"
          clang -target aarch64-linux-gnu -E -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
            -I "$GITHUB_WORKSPACE/linux/include" \
            -I "$GITHUB_WORKSPACE/linux/include/dt-bindings" \
            -I "$GITHUB_WORKSPACE/linux/arch/arm64/boot/dts" \
            "$GITHUB_WORKSPACE"/linux/arch/arm64/boot/dts/mediatek/mt6789-advan-x1.dts -o "$PDTB"
          dtc -I dts -O dtb -o "$GITHUB_WORKSPACE/build/mt6789-advan-x1.dtb" "$PDTB"
          rm -f "$PDTB"

      - name: Pack U-Boot FIT + boot.scr bundle
        timeout-minutes: 5
        run: |
          python3 "$GITHUB_WORKSPACE/tools/pack_uboot_boot.py" \
            --kernel "$GITHUB_WORKSPACE/build/Image" \
            --dtb "$GITHUB_WORKSPACE/build/mt6789-advan-x1.dtb" \
            --initramfs "$GITHUB_WORKSPACE/build/initramfs.cpio.gz" \
            --compression "${{ inputs.compression || 'gzip' }}" \
            --mode "${{ inputs.boot_mode || 'auto' }}" \
            --max-size 32M \
            --payload-label linux_boot \
            --make-fat-image \
            --out-dir "$GITHUB_WORKSPACE/build"

          cd "$GITHUB_WORKSPACE/build"
          mkimage -l advan-x1.itb
          sha256sum advan-x1.itb boot.scr uEnv.txt mt6789-advan-x1.dtb initramfs.cpio.gz boot-space1.img > sha256sums.txt
          cat sha256sums.txt
          cat boot-manifest.json

      - name: Compress artifacts into tar.xz
        timeout-minutes: 5
        run: |
          cd "$GITHUB_WORKSPACE/build"
          XZ_OPT="-9e -T0" tar -cJf "$GITHUB_WORKSPACE/uboot-bundle.tar.xz" \
            advan-x1.itb boot.scr uEnv.txt boot-space1.img boot-manifest.json \
            space1 $([ -d space2 ] && echo space2) \
            mt6789-advan-x1.dtb initramfs.cpio.gz sha256sums.txt
          ls -lh "$GITHUB_WORKSPACE/uboot-bundle.tar.xz"

      - name: Upload uboot-bundle.tar.xz artifact
        timeout-minutes: 15
        uses: actions/upload-artifact@v6
        with:
          name: advan-x1-mainline-uboot
          path: uboot-bundle.tar.xz
          if-no-files-found: error
          retention-days: 5

  userspace:
    name: Build Userspace (CCCI, MM Plugin, UCM2 & GNOME Mobile — arm64, Google Clang)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_gnome_mobile == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    env:
      CLANG_VERSION: r614150
      TOOLCHAIN_ROOT: ${{ github.workspace }}/toolchain
      SYSROOT: ${{ github.workspace }}/debian-sid-arm64-sysroot
      MUTTER_TAG: 51.1.mobile.23
      SHELL_TAG: 51.1.mobile.23

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v6

      - name: Install cross-build & sysroot host tools
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries="3" update -qq
          sudo apt-get -o Acquire::Retries="3" install -y --no-install-recommends \
            mmdebstrap arch-test debian-archive-keyring qemu-user qemu-user-binfmt binfmt-support \
            ninja-build pkg-config file python3-pip python3-venv xz-utils curl git zstd
          command -v qemu-aarch64-static || command -v qemu-aarch64
          arch-test arm64
          python3 -m venv "$RUNNER_TEMP/meson-venv"
          "$RUNNER_TEMP/meson-venv/bin/pip" install --quiet 'meson>=1.5.0'
          echo "$RUNNER_TEMP/meson-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/meson-venv/bin/meson" --version

      - name: Restore full Google Clang cache (userspace cross-compile)
        id: clang-userspace-cache
        uses: actions/cache/restore@v6
        with:
          path: toolchain/clang-${{ env.CLANG_VERSION }}
          key: aosp-clang-${{ env.CLANG_VERSION }}-userspace-${{ runner.os }}

      - name: Setup Google Clang (userspace-capable)
        timeout-minutes: 10
        run: |
          CLANG_DIR="$(PRUNE_FOR_KERNEL=0 ./scripts/setup-google-clang.sh)"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          "$CLANG_DIR/bin/clang" --version | head -n 2

      - name: Save full Google Clang cache
        if: ${{ steps.clang-userspace-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: toolchain/clang-${{ env.CLANG_VERSION }}
          key: aosp-clang-${{ env.CLANG_VERSION }}-userspace-${{ runner.os }}

      - name: Restore Debian sid arm64 userspace sysroot cache
        id: sysroot-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/sysroot-cache
          key: debian-sid-arm64-userspace-v1-${{ runner.os }}

      - name: Prepare Debian sid arm64 sysroot
        timeout-minutes: 25
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sysroot-cache" "$SYSROOT"
          SYSROOT_TAR="$GITHUB_WORKSPACE/sysroot-cache/debian-sid-arm64-userspace.tar.zst"
          if [ -f "$SYSROOT_TAR" ]; then
            echo "== Unpacking cached Debian sid arm64 sysroot =="
            sudo tar --zstd -xf "$SYSROOT_TAR" -C "$SYSROOT"
          else
            echo "== Bootstrapping Debian sid arm64 sysroot with mmdebstrap =="
            sudo mmdebstrap --arch=arm64 --variant=minbase \
              --components=main \
              --aptopt='Acquire::Retries "3"' \
              --include=ca-certificates,dpkg-dev,xz-utils,gcc,g++,libc6-dev,pkg-config,gobject-introspection,libgirepository-2.0-dev,libadwaita-1-dev,sassc,gettext,python3,wayland-protocols,libwayland-bin,libglib2.0-dev-bin,gjs,libgjs-dev,x11-xkb-utils,xcvt,modemmanager-dev,libmm-glib-dev,libqmi-glib-dev,libmbim-glib-dev,libqrtr-glib-dev,libgudev-1.0-dev \
              sid "$SYSROOT" http://deb.debian.org/debian
            printf 'deb http://deb.debian.org/debian sid main\ndeb-src http://deb.debian.org/debian sid main\n' \
              | sudo tee "$SYSROOT/etc/apt/sources.list" >/dev/null
            sudo cp -L /etc/resolv.conf "$SYSROOT/etc/resolv.conf"
            if [ -x /usr/bin/qemu-aarch64-static ]; then
              sudo cp /usr/bin/qemu-aarch64-static "$SYSROOT/usr/bin/"
            fi
            sudo chroot "$SYSROOT" /bin/bash -c '
              set -e
              export DEBIAN_FRONTEND=noninteractive
              apt-get -o Acquire::Retries=3 update -qq
              apt-get -o Acquire::Retries=3 build-dep -y --no-install-recommends mutter gnome-shell
              apt-get clean
              rm -rf /var/lib/apt/lists/*
            '
            sudo tar --zstd -cf "$SYSROOT_TAR" -C "$SYSROOT" .
            ls -lh "$SYSROOT_TAR"
          fi
          sudo chown -R "$(id -u):$(id -g)" "$SYSROOT/usr"

      - name: Save Debian sid arm64 userspace sysroot cache
        if: ${{ steps.sysroot-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/sysroot-cache
          key: debian-sid-arm64-userspace-v1-${{ runner.os }}

      - name: Compile CCCI daemons, ModemManager plugin & stage UCM2/WWAN tools (Google Clang)
        timeout-minutes: 15
        run: |
          chmod +x ./scripts/build-userspace-tools.sh
          CLANG_DIR="$CLANG_DIR" \
          SYSROOT="$SYSROOT" \
          OUT_DIR="$GITHUB_WORKSPACE/userspace-tools-out" \
          ./scripts/build-userspace-tools.sh

      - name: Upload advan-x1-userspace-tools artifact
        timeout-minutes: 10
        uses: actions/upload-artifact@v6
        with:
          name: advan-x1-userspace-tools
          path: |
            userspace-tools-out/advan-x1-userspace-tools-arm64.tar.xz
            userspace-tools-out/install-userspace-tools.sh
            userspace-tools-out/sha256sums.txt
          if-no-files-found: error
          retention-days: 5

      - name: Compile mutter-mobile & gnome-shell-mobile (Google Clang)
        timeout-minutes: 30
        run: |
          chmod +x ./scripts/build-gnome-mobile.sh
          CLANG_DIR="$CLANG_DIR" \
          SYSROOT="$SYSROOT" \
          OUT_DIR="$GITHUB_WORKSPACE/gnome-mobile-out" \
          JOBS="$(nproc)" \
          ./scripts/build-gnome-mobile.sh

      - name: Upload advan-x1-gnome-mobile artifact
        timeout-minutes: 10
        uses: actions/upload-artifact@v6
        with:
          name: advan-x1-gnome-mobile
          path: |
            gnome-mobile-out/gnome-mobile-*-arm64.tar.xz
            gnome-mobile-out/install-gnome-mobile.sh
            gnome-mobile-out/sha256sums.txt
          if-no-files-found: error
          retention-days: 5
