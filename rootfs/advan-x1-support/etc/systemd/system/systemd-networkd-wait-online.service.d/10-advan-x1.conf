# Advan X1 (MT6789) mainline Linux: do not block boot on network-online.target.
#
# usb0 (ConfigFS NCM gadget) is created by advan-x1-usb-gadget.service in
# multi-user.target, i.e. AFTER network-online.target. NetworkManager owns all
# other interfaces here and NetworkManager-wait-online.service satisfies
# network-online.target. The base systemd-networkd-wait-online unit otherwise
# waits for every networkd-managed link to be online and stalls boot forever,
# since no link exists at that point (and usb0 has no carrier without a host).
#
# This replaces the netplan-generated 10-netplan.conf drop-in that used to
# suppress this unit before cloud-init netplan config was disabled.
[Unit]
ConditionPathExists=/run/advan-x1/network-online-required
