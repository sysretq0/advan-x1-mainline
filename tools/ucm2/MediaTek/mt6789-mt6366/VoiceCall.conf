# Advan X1 (MT6789 + MT6366 + FS1599) ALSA UCM2 Voice Call profile.
#
# Routes MD1 internal voice PCM 2 (PCM_2_CAP_CH1 / PCM_2_PB_CH1..2) directly
# across the AFE hardware crossbar to MT6366 ADDA via Hostless_Speech (hw:*,5).
# Lineout Volume is strictly capped at 8 (-200 mB) to protect the FS1599 amp.

SectionVerb {
	EnableSequence [
		cset "name='LOL Mux' 'Open'"
		cset "name='HPL Mux' 'Open'"
		cset "name='HPR Mux' 'Open'"
		cset "name='RCV Mux' 'Open'"
		cset "name='PGA L Mux' 'None'"
		cset "name='PGA R Mux' 'None'"
		cset "name='ADDA_DL_CH1 DL1_CH1 Switch' off"
		cset "name='ADDA_DL_CH2 DL1_CH2 Switch' off"
		cset "name='ADDA_DL_CH2 DL1_CH1 Switch' off"
		cset "name='ADDA_DL_CH1 PCM_2_CAP_CH1 Switch' on"
		cset "name='ADDA_DL_CH2 PCM_2_CAP_CH1 Switch' on"
		cset "name='PCM_2_PB_CH1 ADDA_UL_CH1 Switch' on"
		cset "name='PCM_2_PB_CH2 ADDA_UL_CH2 Switch' on"
		cset "name='DAC In Mux' 'Normal Path'"
		cset "name='Lineout Volume' 8"
		cset "name='Headphone Volume' 10"
		cset "name='Handset Volume' 10"
		cset "name='AIF Out Mux' 'Normal Path'"
		cset "name='Mic Type Mux' 'ACC'"
		cset "name='ADC L Mux' 'Left Preamplifier'"
		cset "name='ADC R Mux' 'Right Preamplifier'"
		cset "name='PGA Volume' 3"
	]

	DisableSequence [
		cset "name='ADDA_DL_CH1 PCM_2_CAP_CH1 Switch' off"
		cset "name='ADDA_DL_CH2 PCM_2_CAP_CH1 Switch' off"
		cset "name='PCM_2_PB_CH1 ADDA_UL_CH1 Switch' off"
		cset "name='PCM_2_PB_CH2 ADDA_UL_CH2 Switch' off"
		cset "name='LOL Mux' 'Open'"
		cset "name='HPL Mux' 'Open'"
		cset "name='HPR Mux' 'Open'"
		cset "name='RCV Mux' 'Open'"
		cset "name='PGA L Mux' 'None'"
		cset "name='PGA R Mux' 'None'"
		cset "name='Mic Type Mux' 'Idle'"
		cset "name='ADC L Mux' 'Idle'"
		cset "name='ADC R Mux' 'Idle'"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "Handset Earpiece"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='RCV Mux' 'Voice Playback'"
	]

	DisableSequence [
		cset "name='RCV Mux' 'Open'"
	]

	Value {
		PlaybackPriority 300
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},5"
		PlaybackMixerElem "Handset"
	}
}

SectionDevice."Headphones" {
	Comment "3.5mm Headphones"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	EnableSequence [
		cset "name='HPL Mux' 'Audio Playback'"
		cset "name='HPR Mux' 'Audio Playback'"
	]

	DisableSequence [
		cset "name='HPL Mux' 'Open'"
		cset "name='HPR Mux' 'Open'"
	]

	Value {
		PlaybackPriority 200
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},5"
		PlaybackMixerElem "Headphone"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speaker"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		cset "name='Lineout Volume' 8"
		cset "name='LOL Mux' 'Playback'"
	]

	DisableSequence [
		cset "name='LOL Mux' 'Open'"
	]

	Value {
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},5"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='PGA L Mux' 'AIN0'"
		cset "name='PGA R Mux' 'AIN0'"
	]

	DisableSequence [
		cset "name='PGA L Mux' 'None'"
		cset "name='PGA R Mux' 'None'"
	]

	Value {
		CapturePriority 100
		CaptureChannels 2
		CapturePCM "hw:${CardId},5"
		CaptureMixerElem "PGA"
	}
}

SectionDevice."Headset" {
	Comment "3.5mm Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='PGA L Mux' 'AIN1'"
		cset "name='PGA R Mux' 'AIN1'"
	]

	DisableSequence [
		cset "name='PGA L Mux' 'None'"
		cset "name='PGA R Mux' 'None'"
	]

	Value {
		CapturePriority 200
		CaptureChannels 2
		CapturePCM "hw:${CardId},5"
		CaptureMixerElem "PGA"
		JackControl "Headset Mic Jack"
	}
}
