SectionVerb {
	EnableSequence [
		cset "name='LOL Mux' 'Open'"
		cset "name='HPL Mux' 'Open'"
		cset "name='HPR Mux' 'Open'"
		cset "name='RCV Mux' 'Open'"
		cset "name='PGA L Mux' 'None'"
		cset "name='PGA R Mux' 'None'"
		cset "name='ADDA_DL_CH1 DL1_CH1 Switch' on"
		cset "name='ADDA_DL_CH2 DL1_CH2 Switch' on"
		cset "name='DAC In Mux' 'Normal Path'"
		cset "name='Lineout Volume' 8"
		cset "name='Headphone Volume' 10"
		cset "name='Handset Volume' 10"
		cset "name='UL1_CH1 ADDA_UL_CH1 Switch' on"
		cset "name='UL1_CH2 ADDA_UL_CH2 Switch' on"
		cset "name='AIF Out Mux' 'Normal Path'"
		cset "name='Mic Type Mux' 'ACC'"
		cset "name='ADC L Mux' 'Left Preamplifier'"
		cset "name='ADC R Mux' 'Right Preamplifier'"
		cset "name='PGA Volume' 3"
	]

	DisableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1 Switch' off"
		cset "name='ADDA_DL_CH2 DL1_CH2 Switch' off"
		cset "name='UL1_CH1 ADDA_UL_CH1 Switch' off"
		cset "name='UL1_CH2 ADDA_UL_CH2 Switch' off"
		cset "name='Mic Type Mux' 'Idle'"
		cset "name='ADC L Mux' 'Idle'"
		cset "name='ADC R Mux' 'Idle'"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speaker"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		cset "name='LOL Mux' 'Playback'"
	]

	DisableSequence [
		cset "name='LOL Mux' 'Open'"
	]

	Value {
		PlaybackPriority 100
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Lineout"
	}
}

SectionDevice."Headphones" {
	Comment "3.5mm Headphones"

	ConflictingDevice [
		"Speaker"
		"Earpiece"
	]

	EnableSequence [
		cset "name='HPL Mux' 'Audio Playback'"
		cset "name='HPR Mux' 'Audio Playback'"
	]

	DisableSequence [
		cset "name='HPL Mux' 'Open'"
		cset "name='HPR Mux' 'Open'"
	]

	Value {
		PlaybackPriority 200
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Headphone"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Earpiece" {
	Comment "Handset Earpiece"

	ConflictingDevice [
		"Speaker"
		"Headphones"
	]

	EnableSequence [
		cset "name='RCV Mux' 'Voice Playback'"
	]

	DisableSequence [
		cset "name='RCV Mux' 'Open'"
	]

	Value {
		PlaybackPriority 50
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Handset"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='PGA L Mux' 'AIN0'"
		cset "name='PGA R Mux' 'AIN0'"
	]

	DisableSequence [
		cset "name='PGA L Mux' 'None'"
		cset "name='PGA R Mux' 'None'"
	]

	Value {
		CapturePriority 100
		CaptureChannels 2
		CapturePCM "hw:${CardId},3"
		CaptureMixerElem "PGA"
	}
}

SectionDevice."Headset" {
	Comment "3.5mm Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='PGA L Mux' 'AIN1'"
		cset "name='PGA R Mux' 'AIN1'"
	]

	DisableSequence [
		cset "name='PGA L Mux' 'None'"
		cset "name='PGA R Mux' 'None'"
	]

	Value {
		CapturePriority 200
		CaptureChannels 2
		CapturePCM "hw:${CardId},3"
		CaptureMixerElem "PGA"
		JackControl "Headset Mic Jack"
	}
}
