# MediaTek MT6789 / MT6366 ALSA headroom override.
#
# Prevents intermittent PipeWire audio dropouts on big.LITTLE ARM64 by
# giving the MT6789 AFE DMA ring 1024 frames (~21.3 ms at 48 kHz) of
# scheduling headroom instead of the default 0.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 1024
        api.alsa.headroom    = 1024
      }
    }
  }
]
