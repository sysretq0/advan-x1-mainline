# MediaTek MT6789 pipewire-pulse minimum request/quantum floor.
#
# Prevents PulseAudio clients (such as WebKitGTK / Epiphany) from requesting
# sub-10 ms bursts that underrun under heavy browser or GPU load.

pulse.properties = {
    pulse.min.req     = 1024/48000
    pulse.min.quantum = 1024/48000
}
